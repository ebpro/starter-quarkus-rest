name: Java CI with Maven

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      # We run 'verify' to trigger Surefire (Unit) and Failsafe (Integration/Cucumber)
      run: |
        # Get the timestamp of the latest commit
        TIMESTAMP=$(git log -1 --format=%cI)
        ./mvnw -B verify -Dproject.build.outputTimestamp=$TIMESTAMP
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and Push Multi-arch Image
      run: |
        # Get the timestamp of the latest commit
        TIMESTAMP=$(git log -1 --format=%cI)
        ./mvnw clean package -Dproject.build.outputTimestamp=$TIMESTAMP \
          -Pjvm \
          -Dquarkus.container-image.push=true \
          -Dquarkus.container-image.registry=docker.io \
          -Dquarkus.jib.platforms=linux/amd64,linux/arm64

  deploy-docs:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Explicitly set a stable LTS version

      - name: Build Redoc HTML
        run: |
          mkdir -p public
          # Use npx to run the latest Redocly CLI without manual install
          npx --yes @redocly/cli build-docs src/main/resources/META-INF/openapi.yaml --output public/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
