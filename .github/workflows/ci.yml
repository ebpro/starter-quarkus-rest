name: Java CI with Maven (Quarkus + Jib + SemVer)

on:
  push:
    branches: [ "develop", "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  REGISTRY: docker.io
  ACCOUNT: brunoe
  # Fallback for TIMESTAMP if head_commit is null (e.g. on PRs)
  TIMESTAMP: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ##########################################################
      # 1. Extract Metadata (The SemVer Brain)
      ##########################################################
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ACCOUNT }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      ##########################################################
      # 2. Build, Test, and Sonar (Single Pass)
      ##########################################################
      - name: Build & Sonar Analysis
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B clean verify sonar:sonar \
            -Psonar \
            -Dproject.build.outputTimestamp=${{ env.TIMESTAMP }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      ##########################################################
      # 3. Jib Push (Multi-arch + Dynamic Tags)
      ##########################################################
      - name: Push to DockerHub (Jib)
        run: |
          # Transform the multiline tags from metadata action into a comma-separated list
          TAG_LIST=$(echo "${{ steps.meta.outputs.tags }}" | sed 's/.*://' | tr '\n' ',' | sed 's/,$//')

          ./mvnw package -DskipTests -Pjvm \
            -Dquarkus.container-image.push=true \
            -Dquarkus.jib.platforms=linux/amd64,linux/arm64 \
            -Dquarkus.container-image.tag=$TAG_LIST

      ##########################################################
      # 4. Native Build (Main only - no push by default to save time)
      ##########################################################
      - name: Build Native Executable
        if: github.ref == 'refs/heads/main'
        run: ./mvnw package -Pnative -DskipTests

      ##########################################################
      # 5. Docs & Releases
      ##########################################################
      - name: Build Redoc HTML
        run: |
          mkdir -p public
          # Note: Quarkus usually generates OpenAPI at target/openapi.yaml
          # Verify your specific path if 'target/openapi-spec/' is custom
          SPEC_PATH="target/openapi.yaml"
          [ -f "target/openapi-spec/openapi.yaml" ] && SPEC_PATH="target/openapi-spec/openapi.yaml"

          npx --yes @redocly/cli build-docs $SPEC_PATH --output public/index.html

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/*.jar
            target/openapi.yaml
          generate_release_notes: true
