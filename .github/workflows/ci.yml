name: Java CI with Maven (Self-Hosted + Dynamic Docker)

on:
  push:
    branches: [ "develop", "main", "**/feature/**" ]
  pull_request:
    branches: [ "develop", "main", "**/feature/**" ]

env:
  REGISTRY: docker.io             # Docker registry
  ACCOUNT: brunoe                  # Docker Hub username/namespace
  TIMESTAMP: ${{ github.event.head_commit.timestamp }}

jobs:
  build-and-deploy:
    name: CI Pipeline
    runs-on: self-hosted
    # To run on GitHub-hosted runners, uncomment below:
    # runs-on: ubuntu-latest

    steps:

      ##########################################################
      # 1. Checkout
      ##########################################################
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ##########################################################
      # 2. Set Docker Image Name dynamically from repo
      ##########################################################
      - name: Set Docker Image Name
        id: docker_name
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          IMAGE_NAME="${ACCOUNT}/$REPO_NAME"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "Docker image will be: $IMAGE_NAME"

      ##########################################################
      # 3. Set up JDK + Maven cache
      ##########################################################
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      ##########################################################
      # 4. Build & Test
      ##########################################################
      - name: Build & Test
        run: |
          ./mvnw -B clean verify \
            -Dproject.build.outputTimestamp=$TIMESTAMP

      ##########################################################
      # 5. SonarQube Analysis
      ##########################################################
      - name: Run SonarQube Analysis
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B sonar:sonar \
            -Dproject.build.outputTimestamp=$TIMESTAMP \
            -Psonar

      ##########################################################
      # 6. Docker Login
      ##########################################################
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      ##########################################################
      # 7. Set up Docker Buildx (multi-arch)
      ##########################################################
      - name: Set up Docker Buildx
        run: |
          docker buildx create --use || echo "Buildx already exists"

      ##########################################################
      # 8. Build & Push JVM Docker Image (multi-arch)
      ##########################################################
      - name: Build & Push JVM Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.created=${{ env.TIMESTAMP }}

      ##########################################################
      # 9. Optional Native Build (main branch only)
      ##########################################################
      - name: Build Native Image
        if: github.ref == 'refs/heads/main'
        run: |
          ./mvnw -B package \
            -DskipTests \
            -Dproject.build.outputTimestamp=$TIMESTAMP \
            -Pnative

      ##########################################################
      # 10. Upload OpenAPI Spec Artifact
      ##########################################################
      - name: Upload OpenAPI Spec Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: target/openapi-spec/openapi.yaml
          retention-days: 7

      ##########################################################
      # 11a. Set normalized branch name for tags
      ##########################################################
      - name: Normalize Branch Name
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: |
          NORMALIZED_BRANCH=${GITHUB_REF#refs/heads/}
          NORMALIZED_BRANCH=${NORMALIZED_BRANCH//\//-}
          echo "NORMALIZED_BRANCH=$NORMALIZED_BRANCH" >> $GITHUB_ENV

      ##########################################################
      # 11b. Create GitHub Release
      ##########################################################
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}-${{ github.run_number }}
          name: "OpenAPI Spec for ${{ github.ref_name }}"
          body: "OpenAPI spec generated from CI run ${{ github.run_number }} on branch ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      ##########################################################
      # 12. Setup Node.js
      ##########################################################
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      ##########################################################
      # 13. Build Redoc HTML
      ##########################################################
      - name: Build Redoc HTML
        run: |
          mkdir -p public
          npx --yes @redocly/cli build-docs target/openapi-spec/openapi.yaml --output public/index.html

      ##########################################################
      # 14. Deploy to GitHub Pages (Main/Develop only)
      ##########################################################
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
