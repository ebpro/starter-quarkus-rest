name: Java CI (JVM & Native Push)

on:
  push:
    branches: [ "develop", "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  REGISTRY: docker.io
  ACCOUNT: brunoe
  TIMESTAMP: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}

jobs:
  # JOB 1: Test and Push JVM (The "Reliable" version)
  build-jvm:
    runs-on: self-hosted
    outputs:
      primary_tag: ${{ steps.tag_logic.outputs.primary }}
      additional_tags: ${{ steps.tag_logic.outputs.additional }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Sonar
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          unset DOCKER_METADATA_OUTPUT_JSON
          ./mvnw -B clean verify sonar:sonar -Psonar -Dproject.build.outputTimestamp=${{ env.TIMESTAMP }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ACCOUNT }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Tag Logic
        id: tag_logic
        run: |
          RAW_TAGS=$(echo "${{ steps.meta.outputs.tags }}" | sed 's/.*://' | xargs)
          read -ra TAG_ARRAY <<< "$RAW_TAGS"
          echo "primary=${TAG_ARRAY[0]}" >> $GITHUB_OUTPUT
          echo "additional=$(IFS=, ; echo "${TAG_ARRAY[*]:1}")" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push JVM Image
        if: github.event_name != 'pull_request'
        run: |
          ./mvnw package -DskipTests -Pjvm \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Dquarkus.container-image.password=${{ secrets.DOCKERHUB_TOKEN }} \
            -Dquarkus.jib.platforms=linux/amd64,linux/arm64 \
            -Dquarkus.container-image.tag=${{ steps.tag_logic.outputs.primary }} \
            -Dquarkus.container-image.additional-tags=${{ steps.tag_logic.outputs.additional }}

  # JOB 2: Build and Push Native (The "Fast" version)
  build-native:
    needs: build-jvm
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Native Image
        run: |
          # Use -native suffix for the primary tag
          NATIVE_TAG="${{ needs.build-jvm.outputs.primary_tag }}-native"

          ./mvnw package -Pnative -DskipTests \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Dquarkus.container-image.password=${{ secrets.DOCKERHUB_TOKEN }} \
            -Dquarkus.container-image.tag=$NATIVE_TAG

  # JOB 3: Documentation (Parallel with Native)
  deploy-docs:
    needs: build-jvm
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generate Spec Only
        run: ./mvnw quarkus:generate-code

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Redoc & Prepare Assets
        run: |
          mkdir -p public
          # Build HTML and add a download button for the YAML
          npx --yes @redocly/cli build-docs \
              target/openapi-spec/openapi.yaml \
              --output public/index.html \
              --options.downloadDefinitionUrl=openapi.yaml

          # Copy raw YAML for machine/UI download
          cp target/openapi-spec/openapi.yaml public/openapi.yaml

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          # 'main' goes to root, 'develop' goes to /develop folder
          destination_dir: ${{ github.ref == 'refs/heads/main' && '.' || github.ref_name }}
          # KEEP_FILES=true prevents develop from deleting main and vice versa
          keep_files: true

      - name: Upload to GitHub Release (Tags Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/openapi-spec/openapi.yaml
