name: Java CI with Maven

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build:
    name: Build, Analyze & Push Container
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      ########################################
      # Sonar analysis
      ########################################
      - name: Build + Test + Sonar
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          TIMESTAMP=$(git log -1 --format=%cI)

          ./mvnw -B clean verify sonar:sonar \
            -Dproject.build.outputTimestamp=$TIMESTAMP \
            -Psonar \
            -Dsonar.login=$SONAR_TOKEN

      ########################################
      # Docker login
      ########################################
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      ########################################
      # Build and push container
      ########################################
      - name: Package and Push Image
        run: |
          TIMESTAMP=$(git log -1 --format=%cI)

          ./mvnw -B package \
            -DskipTests \
            -Dproject.build.outputTimestamp=$TIMESTAMP \
            -Pjvm \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.registry=docker.io \
            -Dquarkus.jib.platforms=linux/amd64,linux/arm64

      - name: Upload OpenAPI Spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: target/openapi-spec/openapi.yaml
          retention-days: 1
