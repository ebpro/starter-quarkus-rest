# ==========================
# Database
# ==========================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:tpuser}
quarkus.datasource.password=${DB_PASSWORD:Tp@2026}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:products}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=10

# ==========================
# HTTP
# ==========================
quarkus.http.host=0.0.0.0
quarkus.http.port=${HOST_HTTP_PORT:8080}

# ==========================
# Hibernate (MAJ Migration 3.23+)
# On remplace 'database.generation' par 'schema-management.strategy'
# ==========================
quarkus.hibernate-orm.schema-management.strategy=${HIBERNATE_GENERATION:update}
quarkus.hibernate-orm.log.sql=${LOG_SQL:false}
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================
# OpenAPI / Swagger
# ==========================
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true
# Force the generation of the file into a known location in target
quarkus.smallrye-openapi.store-schema-directory=target/openapi-spec

# ==========================
# Health Checks
# ==========================
# Validates that the database is actually reachable
quarkus.datasource.health.enabled=true

# ==========================
# Logging
# ==========================
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# Dev SQL logging
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.log.category."org.hibernate.SQL".level=DEBUG
%dev.quarkus.log.category."org.hibernate.type.descriptor.sql.BasicBinder".level=TRACE

# ==========================
# Container / JIB
# Pour le dev local, on laisse souvent le registry vide pour éviter
# les erreurs de manifest sur Docker Compose.
# ==========================
quarkus.container-image.registry=${REGISTRY:}
quarkus.container-image.group=${IMAGE_GROUP:brunoe}
quarkus.container-image.name=${IMAGE_NAME:product-catalog}
quarkus.container-image.tag=${JIB_TAG:1.0.0-jib}
# Support pour PC (amd64) et Apple Silicon/Serveurs ARM (arm64)
quarkus.jib.platforms=${IMAGE_PLATFORMS:linux/amd64,linux/arm64}
