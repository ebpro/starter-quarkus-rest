
# 1. Logging
# Lower Hibernate logging to WARN to reduce noise during tests
quarkus.log.category."org.hibernate".level=WARN

# 2. Port Management
# Pick a random port to avoid conflicts during parallel builds
quarkus.http.test-port=0

# 3. Rest Client Configuration
# This dynamically points the client to the random port picked above
quarkus.rest-client.product-api.url=http://localhost:${quarkus.http.test-port}

# 4. Error Handling
# Allows us to receive 409/404 as Response objects rather than throwing exceptions
quarkus.rest-client.product-api.disable-default-mapper=true

